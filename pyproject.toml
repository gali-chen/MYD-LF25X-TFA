[tool.poetry]
name = "trusted-firmware-a"
version = "2.10.5"
description = "Trusted Firmware-A (TF-A) Python dependencies."
authors = ["Arm Ltd."]
license = "BSD-3-Clause"
readme = "readme.rst"
packages = [
	{ include = "memory", from = "tools/memory"}
]

[tool.poetry.scripts]
memory = "memory.memmap:main"

[tool.poetry.dependencies]
python = "^3.8"
urllib3 = {version = "^2.7.0", python = ">=3.10"}
setuptools = {version = "^83.0.0", python = ">=3.10"}
requests = {version = "^2.33.0", python = ">=3.10"}
idna = {version = "^3.15", python = ">=3.10"}
Pygments = {version = "^2.20.0", python = ">=3.9"}
pip = {version = "^26.1.2", python = ">=3.10"}
wheel = {version = "^0.46.2", python = ">=3.9"}

[tool.poetry.group.doc.dependencies]
sphinx = "^5.3.0"
myst-parser = "^0.18.1"
sphinxcontrib-plantuml = "^0.24.1"
sphinx-rtd-theme = "^1.1.1"
pip-tools = "^6.4.0"
sphinxcontrib-svg2pdfconverter = "^1.2.2"

[tool.poetry.group.ci.dependencies]
click = "^8.1.3"

[tool.poetry.group.memory.dependencies]
pyelftools = "^0.29"
anytree = "^2.8.0"
click = "^8.1.3"
prettytable = "^3.5.0"
